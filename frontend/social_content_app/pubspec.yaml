name: social_content_app
description: Prototyp aplikacji do zarządzania treściami social media dla content managerów.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  # Czat i powiadomienia w czasie rzeczywistym (SignalR); Windows, web i Android.
  signalr_netcore: ^1.4.1
  video_player: ^2.9.2
  # Odtwarzanie wideo/audio na Windows (video_player nie wspiera go natywnie).
  video_player_win: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
